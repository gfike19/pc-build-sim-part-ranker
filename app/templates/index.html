{% extends "base.html" %}

{% block content %}
{{ parts }}
<form method="POST">
    <label for="stashName">New Stash Name: </label>
    <input type="text" name="stashName" id="stashName">
    <button type="submit" class="btn-success" name="action" value="create-stash">Create New Stash</button>
    <button type="reset" class="btn-secondary">Clear</button>
<hr/>
<h1>Stashes</h1>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Stash Name</th>
        </tr>
    </thead>

    <tbody>
        {% for stash in stashes %}
        <tr>
            <td><input type="radio" name="stash_id" id="stash_{{ stash.id }}" value="{{ stash.id }}" required></td>
            <td>{{ stash.id }}</td>
            <td>{{ stash.stashName }}</td>
        </tr>
        {% else %}
        <tr>
            <td colspan="3">No stashes found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
    <button type="submit" class="btn-dark" name="action" value="add-parts">Add Parts to Stash</button>
    <button type="submit" class="btn-danger" name="action" value="delete-stash">Delete Stash</button>
</form>
{% endblock %}
