{% extends "base.html" %}

{% block content %}
<form method="POST">
<h2>GPUs</h2>

<table>

    <tbody>
        {% for gpu in gpus %}
        <tr>
            <td><input type="checkbox" name="gpu_id" id="gpu_{{ gpu.id }}" value="{{ gpu.id }}"></td>
            <td>{{ gpu.partName }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<h2>CPUs</h2>

<table>
    <tbody>
        {% for cpu in cpus %}
        <tr>
            <td><input type="checkbox" name="cpu_id" id="cpu_{{ cpu.id }}" value="{{ cpu.id }}"></td>
            <td>{{ cpu.partName }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</form>
{% endblock %}
